<main class="form-main">
    <div class="container">
        <h2>拾獲表單</h2>
        <form class="custom-form">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" placeholder="輸入姓名">

            <label for="id">學號</label>
            <input type="text" id="id" name="studentId" placeholder="輸入學號">

            <label for="phone">聯絡方式(手機)</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{4}-[0-9]{6}" placeholder="例如0912-345678">

            <label for="time">拾獲時間</label>
            <input type="datetime-local" id="time" name="time">

            <label for="location">拾獲地點</label>
            <input type="text" id="location" name="location" placeholder="輸入拾獲地點">

            <label for="describe">外觀描述</label>
            <textarea id="describe" name="description" rows="3" placeholder="描述物品外觀"></textarea>

            <label for="sort">物品分類</label>
            <select id="sort" name="category">
                <option value="">學生證</option>
                <option value="雨傘">雨傘</option>
                <option value="手機">手機</option>
                <option value="錢包">錢包</option>
                <option value="耳機">耳機</option>
                <option value="行充">行充</option>
                <option value="其他">其他</option>
            </select>

            <label for="picture">拾獲物照片</label>
            <div class="file-input">
                <input type="file" id="picture" name="picture" accept="image/*">
            </div>
            <button type="submit">送出</button>
        </form>
    </div>
</main>
